<style>
  :root{
    --bg: #211E1C;
    --panel: #2B2724;
    --panel-light: #34302C;
    --border: rgba(245,240,235,0.28);
    --border-strong: rgba(245,240,235,0.55);
    --text: #F5F0EB;
    --muted: #B8ADA3;
    --accent: #CBA38B;
    --accent-dark: #A9805F;
    --danger: #C9605A;
    --radius: 10px;
    --serif: 'Bodoni Moda', serif;
    --sans: 'Jost', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  a{color:inherit;}

  .container{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ---------- Header ---------- */
  .site-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:28px 0;border-bottom:1px solid var(--border);
  }
  .logo{
    font-family:var(--serif);font-size:28px;letter-spacing:0.14em;
    text-transform:uppercase;font-weight:600;
  }
  .logo-img{
    width:168px;height:168px;border-radius:50%;object-fit:cover;
    border:1px solid var(--border-strong);
  }
  .social-links{display:flex;gap:14px;}
  .social-link{
    font-family:var(--mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;transition:color .2s;
  }
  .social-link:hover{color:var(--accent);}
  .lang-switch{display:flex;gap:6px;}
  .lang-switch button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    font-family:var(--mono);font-size:12px;letter-spacing:0.05em;
    padding:6px 10px;border-radius:6px;cursor:pointer;transition:all .2s;
  }
  .lang-switch button.active{border-color:var(--accent);color:var(--accent);}
  .lang-switch button:hover{border-color:var(--border-strong);color:var(--text);}

  /* ---------- Hero ---------- */
  .hero{padding:72px 0 56px;text-align:center;border-bottom:1px solid var(--border);}
  .hero h1{
    font-family:var(--serif);font-size:clamp(40px,7vw,72px);
    letter-spacing:0.08em;text-transform:uppercase;margin:0 0 14px;
    line-height:1.05;font-weight:600;
  }
  .hero p{color:var(--accent);font-size:clamp(17px,2.4vw,22px);font-weight:500;letter-spacing:0.01em;max-width:560px;margin:0 auto 32px;}
  .cta-btn{
    display:inline-block;background:var(--accent);color:#20140C;border:none;
    font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:0.04em;
    text-transform:uppercase;padding:14px 32px;border-radius:999px;cursor:pointer;
    transition:transform .15s, background .2s;
  }
  .cta-btn:hover{background:var(--accent-dark);transform:translateY(-1px);}
  .cta-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .cta-btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text);}
  .cta-btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent;}

  /* ---------- Section shell ---------- */
  section.block{padding:64px 0;border-bottom:1px solid var(--border);}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:0.15em;color:var(--accent);
    text-transform:uppercase;margin-bottom:10px;
  }
  h2.block-title{
    font-family:var(--serif);font-size:clamp(28px,4vw,40px);letter-spacing:0.05em;
    text-transform:uppercase;margin:0 0 36px;font-weight:600;
  }

  /* ---------- Catálogo ---------- */
  .catalogo-pendiente{
    margin-top:20px;min-height:120px;border:1px dashed var(--border-strong);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;color:var(--muted);
    font-family:var(--mono);font-size:13px;text-align:center;padding:24px;
  }

  /* ---------- Servicios (cards tipo "lista de precios") ---------- */
  .servicios-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .servicio-card{
    border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:18px 20px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;background:var(--panel);transition:all .15s;
  }
  .servicio-card:hover{border-color:var(--accent);}
  .servicio-card.selected{border-color:var(--accent);background:var(--panel-light);box-shadow:0 0 0 1px var(--accent) inset;}
  .servicio-nombre{font-size:14px;letter-spacing:0.06em;text-transform:uppercase;}
  .servicio-precio{font-family:var(--mono);color:var(--accent);font-size:15px;border:1px solid var(--border-strong);border-radius:8px;padding:6px 12px;}

  /* ---------- Booking steps ---------- */
  .steps-nav{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap;}
  .step-pill{
    font-family:var(--mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:6px 14px;
  }
  .step-pill.active{color:var(--accent);border-color:var(--accent);}
  .step-pill.done{color:var(--text);border-color:var(--border-strong);}
  .step-pill.clickable{cursor:pointer;}
  .step-pill.clickable:hover{border-color:var(--accent);color:var(--accent);}

  .wizard-step{animation:wizard-fade-in .25s ease;}
  @keyframes wizard-fade-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .wizard-selected-summary{
    font-family:var(--mono);font-size:12px;letter-spacing:0.04em;color:var(--accent);
    border:1px solid var(--border);border-radius:8px;padding:8px 14px;display:inline-block;margin-bottom:20px;
  }
  .wizard-back{margin-top:20px;}
  .wizard-actions{display:flex;gap:12px;align-items:center;}

  input[type="date"], input[type="text"], input[type="tel"], input[type="email"]{
    background:var(--panel);border:1px solid var(--border-strong);color:var(--text);
    font-family:var(--sans);font-size:14px;padding:12px 14px;border-radius:8px;width:100%;
  }
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .form-row{margin-bottom:18px;max-width:420px;}

  .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
  .slot-box{
    border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:16px;text-align:center;cursor:pointer;font-family:var(--mono);font-size:14px;
    transition:all .15s;background:var(--panel);
  }
  .slot-box.selected{border-color:var(--accent);background:var(--panel-light);color:var(--accent);}
  .slot-box.disabled{opacity:0.3;cursor:not-allowed;text-decoration:line-through;}
  .slot-box:not(.disabled):hover{border-color:var(--accent);}

  .empty-note{color:var(--muted);font-size:14px;font-style:italic;}

  /* ---------- Calendario mensual ---------- */
  .calendario-mes{max-width:340px;}
  .calendario-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav{
    background:transparent;border:1px solid var(--border-strong);color:var(--text);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;
  }
  .cal-nav:hover{border-color:var(--accent);color:var(--accent);}
  .cal-mes-label{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
  .calendario-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .cal-weekday{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);padding-bottom:2px;}
  .cal-day{
    aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:transparent;
    color:var(--text);font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .15s;
  }
  .cal-day.empty{border:none;cursor:default;}
  .cal-day.disponible{border-color:var(--border-strong);}
  .cal-day.disponible:hover{border-color:var(--accent);color:var(--accent);}
  .cal-day.selected{background:var(--accent);color:#20140C;border-color:var(--accent);font-weight:600;}
  .cal-day.lleno{color:var(--muted);border-color:var(--border);text-decoration:line-through;cursor:not-allowed;opacity:0.45;}
  .cal-day.pausado{color:var(--muted);border-style:dashed;cursor:not-allowed;opacity:0.45;}
  .cal-day.pasado{color:var(--muted);border-color:transparent;cursor:not-allowed;opacity:0.2;}
  .cal-day.cargando{color:var(--muted);border-color:var(--border);opacity:0.35;cursor:wait;}

  .confirm-box{
    border:1px solid var(--accent);border-radius:var(--radius);padding:28px;
    background:var(--panel);max-width:480px;
  }
  .confirm-box h3{font-family:var(--serif);letter-spacing:0.05em;text-transform:uppercase;margin-top:0;}

  /* ---------- Footer ---------- */
  footer{padding:32px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:0.05em;}

  /* ---------- Admin ---------- */
  .admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .admin-login form{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius);padding:36px;width:320px;}
  .admin-shell{padding:32px 0;}
  .admin-tabs{display:flex;gap:10px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:14px;}
  .admin-tab{
    background:transparent;border:none;color:var(--muted);font-family:var(--mono);
    font-size:12px;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;padding:8px 4px;
  }
  .admin-tab.active{color:var(--accent);border-bottom:2px solid var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);}
  th{font-family:var(--mono);color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:0.05em;}
  .small-btn{
    background:transparent;border:1px solid var(--border-strong);color:var(--text);
    font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;
  }
  .small-btn:hover{border-color:var(--accent);color:var(--accent);}
  .small-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .error-msg{color:var(--danger);font-size:13px;margin-top:8px;}
  .inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:24px;}
  .inline-form .form-row{margin-bottom:0;max-width:180px;}
  /* ---------- Responsive / móvil ---------- */
  @media (max-width: 640px){
    .container{padding:0 16px;}
    .site-header{flex-wrap:wrap;gap:12px;padding:20px 0;}
    .logo{font-size:22px;}
    .social-links{gap:10px;}
    .social-link{font-size:11px;}
    .hero{padding:48px 0 36px;}
    section.block{padding:44px 0;}
    h2.block-title{font-size:26px;margin-bottom:24px;}
    .servicios-grid{grid-template-columns:1fr 1fr;gap:10px;}
    .servicio-card{padding:14px;flex-direction:column;align-items:flex-start;gap:8px;}
    .servicio-precio{font-size:13px;padding:4px 10px;}
    .steps-nav{gap:6px;}
    .step-pill{font-size:10px;padding:5px 10px;}
    .slots-grid{grid-template-columns:1fr 1fr;}
    .calendario-mes{max-width:100%;}
    .form-row{max-width:100%;}
    .inline-form{flex-direction:column;align-items:stretch;}
    .inline-form .form-row{max-width:100%;}
    .table-wrap{overflow-x:auto;}
    .admin-shell{overflow-x:auto;}
    table{font-size:12px;min-width:480px;}
    .admin-tabs{gap:6px;}
    .wizard-actions{flex-direction:column;align-items:stretch;}
  }
</style>
</head>

const GAS_URL = "https://script.google.com/macros/s/AKfycbzrmd-kg_Wh5zEkm3M6kEu1RRl65y1aTnvDQ0DEXrALZMU1U5ctMc6s6CICTzx6mIg9IQ/exec";

// ============================================================
// Cliente para llamar al Apps Script (fetch estándar — más robusto que JSONP,
// que resultó frágil frente a sesiones de Google activas en el navegador)
// ============================================================
function gasCall(action, params) {
  const query = new URLSearchParams({ action, ...params });
  const url = GAS_URL + "?" + query.toString();
  return fetch(url)
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status + " al llamar a " + action);
      return res.json();
    })
    .catch(err => {
      console.error("gasCall(" + action + ") falló:", err);
      throw err;
    });
}
